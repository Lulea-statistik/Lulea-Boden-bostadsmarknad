name: Validate anonymous rental suitability
on:
  pull_request:
    paths:
      - "docs/villa_suitability_aggregates.json"
      - "scripts/validate_villa_suitability.py"
      - ".github/workflows/validate_villa_suitability.yml"
  push:
    branches: [main]
    paths:
      - "docs/villa_suitability_aggregates.json"
      - "scripts/validate_villa_suitability.py"
      - ".github/workflows/validate_villa_suitability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_villa_suitability.py docs/villa_suitability_aggregates.json
