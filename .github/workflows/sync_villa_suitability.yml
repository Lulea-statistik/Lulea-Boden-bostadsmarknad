name: Sync anonymiserad uthyrningsklassning
on:
  workflow_dispatch:
  schedule:
    - cron: "10 8 * * 5"

permissions:
  contents: write

concurrency:
  group: rental-aggregate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check read access to private rental repository
        id: access
        env:
          PRIVATE_RENTALS_READ_TOKEN: ${{ secrets.PRIVATE_RENTALS_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_RENTALS_READ_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not active: configure PRIVATE_RENTALS_READ_TOKEN with read-only Actions permission on uthyrning_villa." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download newest successful private aggregate
        if: steps.access.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RENTALS_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rental-export
          run_id=$(gh api "repos/Lulea-statistik/uthyrning_villa/actions/workflows/weekly-authorized-rentals.yml/runs?status=success&per_page=10" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful private source run" >&2
            exit 1
          fi
          gh run download "$run_id" --repo Lulea-statistik/uthyrning_villa --name rental-suitability-aggregate --dir /tmp/rental-export
          test -f /tmp/rental-export/villa_suitability_aggregates.json
          python scripts/validate_villa_suitability.py /tmp/rental-export/villa_suitability_aggregates.json > docs/villa_suitability_aggregates.json
      - name: Commit updated anonymous aggregate
        if: steps.access.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/villa_suitability_aggregates.json; then
            echo "No change to approved anonymous aggregate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/villa_suitability_aggregates.json
          git commit -m "Sync verified anonymous rental suitability"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Published validated anonymous rental suitability." >> "$GITHUB_STEP_SUMMARY"
