name: Update Maklarstatistik

on:
  workflow_dispatch:
  schedule:
    # 07:15 UTC on the 10th of each month.
    # Monthly source data is normally updated around the beginning of the month.
    - cron: "15 7 10 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Maklarstatistik
        run: python src/fetch_maklarstatistik.py

      - name: Build dashboard data
        run: python src/build_dashboard_data.py

      - name: Show collected data
        run: |
          echo "current.csv"
          cat data/maklarstatistik/current.csv

      - name: Commit updated data
        run: |
          # git diff ignores untracked files. On the first successful run both CSV files
          # are new, so use git status to detect tracked *and* untracked data changes.
          if [ -z "$(git status --porcelain -- data/maklarstatistik docs/dashboard_data.json)" ]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/maklarstatistik docs/dashboard_data.json
          git commit -m "Update Maklarstatistik data"
          git push
